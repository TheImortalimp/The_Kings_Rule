  portrait: assets/gate_guard.png
  pattern: add
  rule_example: ADD 10 TO EACH KEY
  answer_band: 100-250
  animation: kickout
  taunts:
  - NOT EVEN THE GATE BELIEVES YOU.
  - I HAVE SEEN FARMERS GUESS BETTER.
  - ONE MORE AND THE PORTCULLIS STAYS SHUT.
  cast_out:
  - THE GATE DOES NOT OPEN TWICE.
  - I SHUT IT MYSELF. GO HOME.
- chamber: 2
  warden: HALL WARDEN
  portrait: assets/hall_warden.png
