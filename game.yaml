cypher_patterns:
- id: add
  chamber: 1
  rule: add a fixed step to each key
  hint_text: ADD <step> TO EACH KEY
  derivation: answer = key3 + step
  example:
    given: [98, 108, 118]
    answer: 128
    why: +10 each step
- id: subtract
  chamber: 2
  rule: subtract a fixed step from each key
  hint_text: SUBTRACT <step> FROM EACH KEY
  derivation: answer = key3 - step
  example:
    given: [322, 302, 282]
    answer: 262
    why: -20 each step
- id: multiply
  chamber: 3
  rule: each key is k times the one before (k = 2, sometimes 3)
  hint_text: DOUBLE EACH KEY / MULTIPLY EACH KEY BY 3
  derivation: answer = k x key3
  example:
    given: [48, 96, 192]
    answer: 384
    why: x2 each step
- id: halve
  chamber: 4
  rule: each key is half the one before
  hint_text: HALVE EACH KEY
  derivation: answer = key3 / 2
  example:
    given: [5712, 2856, 1428]
    answer: 714
    why: /2 each step
- id: squares
  chamber: 5
  rule: the keys are squares, every step (or every 2nd / every 3rd)
  hint_text: EACH KEY IS THE NEXT SQUARE / EVERY 2nd SQUARE / EVERY 3rd SQUARE
  derivation: answer = (sqrt(key3) + step)^2
  example:
    given: [1681, 1764, 1849]
    answer: 1936
    why: 41^2, 42^2, 43^2, so 44^2
- id: fib
  chamber: 6
  rule: each key is the sum of the two before it
  hint_text: EACH KEY IS THE SUM OF THE TWO BEFORE
  derivation: answer = key2 + key3
  example:
    given: [203, 1790, 1993]
    answer: 3783
    why: 1790 + 1993
- id: primes
  chamber: 7
  rule: the keys are consecutive primes
  hint_text: THE KEYS ARE CONSECUTIVE PRIMES
  derivation: answer = the next prime after key3
  example:
    given: [6983, 6991, 6997]
    answer: 7001
    why: the next prime after 6997
- id: compound
  chamber: 8
  rule: double each key, then subtract a fixed number
  hint_text: DOUBLE EACH KEY, THEN SUBTRACT <c>
  derivation: answer = 2 x key3 - c
  example:
    given: [1177, 2332, 4642]
    answer: 9262
    why: 2x1177-22, 2x2332-22, 2x4642-22
- id: king
  chamber: 9
  rule: the King's own rule, never revealed
  hint_text: none - the King refuses
  derivation: none - every guess is denied
  example:
    given: three random four-digit keys
    answer: unreachable
    why: there is no victory screen
hint_system:
  key: '?'
  reveals: the warden's rule plus the working applied to the three keys on screen
  withholds: the answer itself - the last arithmetic step is always the player's
  cost: none, and it never consumes a strike
  toggle: pressing ? again hides the hint; typing a digit also hides it
  king: refuses with WHY WOULD I HELP YOU?
strike_system:
  per_chamber: 3
  on_wrong_key: one strike, the warden taunts, and the same three keys stay
  on_third_strike: the warden delivers its cast-out speech, then a failure animation, GAME OVER, CREDITS
  reset: strikes reset when a new chamber is entered
scoring:
  cleared: number of chambers solved (maximum 8 - the King cannot be beaten)
  shown_on: ACCESS GRANTED, CAST OUT, GAME OVER
audio:
  music: medieval Dorian score (drone, lute arpeggio, lead, bell, drum)
  sfx: correct, wrong, strike, transition, kickout, dungeon, execute, gameover
