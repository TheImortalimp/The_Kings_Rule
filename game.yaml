# THE KING'S RULE - game content metadata
# Machine-readable description of the game: rules, screen flow, chambers, the
# cypher engine, difficulty curve. Companion to meta.yaml (packaging/build info).
# Version 3.1.0 - FAIR CYPHERS.
schema: kings-rule/game/1
title: THE KING'S RULE
subtitle: Apple IIc Terminal Simulation
edition: Fair Cyphers (no repeats)
version: 3.1.1
year: 1983
original_concept: Sunburst Communications
genre:
- puzzle
- logic
- number-sequence
- retro-terminal
player: River Lyle R.
premise: Nine chambers stand between you and The King. Each warden hides a rule and hands you three
  cypher keys. Work out the fourth key. Press ? and the warden will tell you the rule - it costs
  nothing, but it is on his terms. Three wrong keys and you are cast out. The King denies every
  guess; there is no victory screen, only how far you got.
controls:
- key: 0-9
  action: type a digit of the 4th cypher key (up to four digits)
- key: Enter
  action: submit the guess, or advance a screen
- key: Backspace
  action: delete the last digit
- key: '?'
  action: ask the warden for a hint - the rule and the working; the King refuses
rules:
  keys_given_per_chamber: 3
  answer: the 4th key, derived by applying the warden's rule to the third key
  max_answer_digits: 4
  max_value: 9999
  strikes_per_warden: 3
  rule_visibility: hidden - only the ? key reveals it
  hint_cost: none (free and unlimited; pressing ? again hides it)
  on_miss: a strike is recorded and the same three keys stay on the table
  cypher_reroll: never mid-chamber - a new cypher only arrives with the next chamber
  king: 'chamber 9 is unbeatable: every guess is denied'
fairness:
  rule_is_always_literal: applying the room's own rule to its own three keys always yields the accepted answer
  keys: always three, distinct, and monotone in the direction of the answer
  value_range: every key and answer is generated inside 1..9999 - nothing is clamped after the fact
  validation: each generated room is re-derived before it is shown; a room whose rule disagrees with its answer is rejected
  audit: 72000 rooms generated across both engines, 0 failures
variety:
  seed: 32-bit xorshift32 stream (identical in both engines), 2^31 starting points per run
  rooms_remembered: 400 (newest first, per session; persisted in localStorage by the HTML5 build)
  rerolls: up to 64 candidate rooms are tried before a seen room may repeat
  distinct_rooms:
  - chamber: 1
    count: 1963
  - chamber: 2
    count: 4569
  - chamber: 3
    count: 87
  - chamber: 4
    count: 565
  - chamber: 5
    count: 66
  - chamber: 6
    count: 29576
  - chamber: 7
    count: 589
  - chamber: 8
    count: 3319
  rule_variants:
  - chamber: 3
    variant: multiply by 2 (mostly) or 3
  - chamber: 5
    variant: the next square, every 2nd square, or every 3rd square
difficulty:
  model: exponential - chamber n starts at 100 x 1.9^(n-1)
  pattern_axis: the rule itself also rises (+step, -step, x2, /2, squares, fibonacci, primes, two chained operations)
  bands:
  - chamber: 1
    answer_min: 100
    answer_max: 250
  - chamber: 2
    answer_min: 190
    answer_max: 475
  - chamber: 3
    answer_min: 368
    answer_max: 896
  - chamber: 4
    answer_min: 685
    answer_max: 1249
  - chamber: 5
    answer_min: 1296
    answer_max: 3249
  - chamber: 6
    answer_min: 2476
    answer_max: 6190
  - chamber: 7
    answer_min: 4721
    answer_max: 9929
  - chamber: 8
    answer_min: 8938
    answer_max: 9999
screen_flow:
- step: 1
  screen: INTRO
  shows: title, sunburst line, four animated copper bars
  advance: Enter
- step: 2
  screen: ENTER THE CASTLE
  shows: the nine chambers, the controls, the ? hint, three strikes
  advance: Enter
- step: 3
  screen: CHAMBER n / 9
  shows: warden portrait, three cypher keys, input line, strike counter, ? hint line
  advance: correct key
- step: 4
  screen: ACCESS GRANTED
  shows: the solved 4th key in green, CYPHER SOLVED, the rule that was in play, cleared count
  advance: automatic after 1200 ms
- step: 5
  screen: CHAMBER CLEARED
  shows: room number and warden name
  advance: Enter
- step: 6
  screen: CAST OUT
  shows: '<warden name> BARS YOUR WAY, that warden''s two-line speech, STRIKE 3/3 - CAST OUT, chambers cleared'
  advance: Enter
- step: 7
  screen: FAILURE ANIMATION
  shows: kickout / dungeon / execute, or the King's beheading
  advance: automatic after 2000 ms
- step: 8
  screen: GAME OVER
  shows: chambers cleared out of 8, the King rejects your cypher
  advance: Enter
- step: 9
  screen: CREDITS
  shows: credits and developer name
  advance: Enter -> back to INTRO
screen_flow_notes: Steps 3-5 repeat for chambers 1 through 9 - all nine chambers are reached in one run.
  Every screen is opaque and fully replaces the previous one; nothing is stacked or dimmed.
chambers:
