# THE KING'S RULE - package / build metadata
# Release info, artifacts and checksums, requirements, verification, changelog.
# Companion to game.yaml (game content). Regenerate the manifest after any rebuild.
schema: kings-rule/package/1
package:
  name: kings-rule
  edition: fair-cyphers
  version: 3.1.0
  release_date: '2026-11-14'
  license: freeware / fan remake - see attribution
  language: en
  archive:
    file: kings_rule_swf.zip
    files: 56
    uncompressed_bytes: 4447387
entrypoints:
- file: game.html
  label: HTML5 game (offline)
  requires: any modern browser
  notes: keep the assets/ folder next to it
- file: kings_rule.html
  label: SWF in a single page
  requires: any modern browser + internet once (Ruffle from CDN)
  notes: the whole 783 KB SWF is embedded as base64
- file: kings_rule.swf
  label: raw Flash movie
  requires: Ruffle or Adobe Flash Player
  notes: do not hand this to an audio player - Windows may map .swf to Winamp
artifacts:
  kings_rule.swf:
    bytes: 784741
    md5: 816f3aa716d62797b0d8b836a9e3373e
    format: SWF v10 (CWS, zlib compressed), AVM2/AS3
    stage: 1024x768
    fps: 30
    embedded:
      sounds_mp3: 10
      bitmaps_jpeg: 9
      abc_blocks: 1
    plays_in:
    - Ruffle 0.7.1
    - Adobe Flash Player projector
  kings_rule.html:
    bytes: 1049749
    md5: a6bd6c41ec2b17ffcdc6cc97d6c69a80
    self_contained: true
    external_dependency: https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.7.1/ruffle.js
  game.html:
    bytes: 62011
    md5: 7b1c47c8e9a1901d51b3f553b4ecd483
    self_contained: false
    companion_folder: assets/
    runtime: vanilla JS + Canvas 2D + Web Audio, no libraries
requirements:
  browser: Chrome / Edge / Firefox / Safari, current versions
  plugins: none
  internet:
    game.html: false
    kings_rule.html: true
    kings_rule.swf: false
  install: none - unzip and double-click
  min_viewport: 1024x768 (layout scales down)
contents:
- HOW-TO-OPEN.txt
- README.md
- meta.yaml
- game.yaml
- game.html
- kings_rule.html
- kings_rule.swf
- assets/  (9 guard portraits + background, 48-colour PNG)
build:
  swf_toolchain: Haxe 4.3.6 (-swf, no Flex/Flash SDK)
  swf_command: haxe -cp src -main Main -swf kings_rule.swf -D swf-header=1024:768:30:000000
  html_wrapper_command: python3 tools/make_html.py kings_rule.html
  asset_pipeline: python3 tools/make_assets.py (font, portraits, audio)
  sources: kings_rule_swf/src/*.hx for the SWF; original HTML5 remake for game.html
verification:
  flow_tested_in:
  - Ruffle 0.7.1 (headless Chromium)
  - Chromium headless (HTML5 build)
  flow_order:
  - INTRO
  - ENTER THE CASTLE
  - CHAMBER 1-9
  - ACCESS GRANTED
  - CHAMBER CLEARED
  - CAST OUT
  - FAILURE ANIMATION
  - GAME OVER
  - CREDITS
  overlapping_screens: false
  page_errors: 0
  chambers_reached: 1-9 verified by a scripted playthrough in both builds
  cypher_audit: 72000 generated rooms, 0 invalid, 0 where the stated rule disagrees with the accepted answer
  screenshots: kings_rule_swf/screenshots/ (SWF) and kings_rule_swf/screenshots/html/ (HTML5)
changelog:
- version: 3.1.0
  date: '2026-11-14'
  changes:
  - fixed the DIVIDE room, which hinted "divide by b" over keys [4b,3b,2b] and was unwinnable in 100% of its rolls; the rule is now literal in every room
  - fixed silent clamping of answers above 9999, which could accept a number the working on screen disagreed with
  - replaced the random pattern pool with one fixed rule per chamber (add, subtract, double, halve, squares, fibonacci, primes, double-then-subtract)
  - put difficulty on an exponential curve: answer band x1.9 per chamber from 100-155 up to 8938-9999
  - the rule is now the warden's secret; ? gives a free, unlimited hint (the rule plus the working) and never costs a strike
  - a wrong guess no longer re-rolls the cypher: the same three keys stand for all three strikes
  - every warden now speaks: three taunts plus its own cast-out speech; the King denies everything in his own words
  - 'HTML5 build: fixed a CSS downscale that dropped glyph rows ("ENTER" rendered as "FNTER"); the terminal now draws at 2x'
  - 'HTML5 build: per-guard strike and failure messages were being erased every frame; they are now persistent screen state'
  - the King's three keys are no longer 0/0/0
  - verified 72,000 generated rooms and a full 1-9 playthrough in both builds
- version: 3.0.0
  date: '2026-11-14'
  changes:
  - 'screen flow rebuilt to match the original: one opaque screen at a time, nothing stacked'
  - added the missing reward screen after a correct answer (CYPHER SOLVED, ~1.2 s)
  - re-packaged as game.html + assets/ next to the SWF and the single-page build
  - added YAML metadata (meta.yaml, game.yaml)
- version: 2.0.0
  date: '2026-11-13'
  changes:
  - 'harder cyphers: values to 9999, four-digit answers, earlier hard patterns, growing + compound patterns'
  - added kings_rule.html so the game opens by double-click in a browser
- version: 1.0.0
  date: '2026-11-12'
  changes:
  - first single-file SWF port of the HTML5 remake
